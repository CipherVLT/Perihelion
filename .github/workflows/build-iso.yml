---
# Build the Perihelion installer ISOs on GitHub's servers.
#
# 1. check:   every package each flavor lists exists (Fedora, Terra, COPR)
# 2. release: on main, make sure the rolling "testing" pre-release exists
# 3. build:   per flavor, in a fedora:45 container:
#             - rehearse the install: install the flavor's packages exactly as
#               the kickstart does and run the real %post scripts
#               (scripts/test-install.sh); stop here if that fails
#             - download + SHA256-check the pinned Fedora netinstall ISO,
#               build perihelion-<flavor>.iso and verify it
#             - replace that flavor's ISO (+ .sha256) on "testing"
#             A failing flavor keeps its previous ISO; the others still publish.
#
# ISOs go to a GitHub Release, not to workflow artifacts: release files
# don't count against the Actions storage quota (500 MB on a free private
# repo, and each ISO is ~1.2 GiB). Releases of a private repo are private.
#
# Pull requests run check + build to prove the change works, without
# publishing anything. Personal-use wallpapers are never fetched here.
name: Build ISOs

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Which flavor to build"
        required: true
        default: all
        type: choice
        options: [all, mango, hyprland, niri]
  push:
    branches: [main]
    paths:
      - 'kickstart/**'
      - 'packages/**'
      - 'build/**'
      - 'system_files/**'
      - 'scripts/**'
      - '.github/workflows/build-iso.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_TAG: testing

jobs:
  plan:
    name: Pick flavors
    runs-on: ubuntu-24.04
    outputs:
      flavors: ${{ steps.pick.outputs.flavors }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - id: pick
        env:
          INPUT_FLAVOR: ${{ inputs.flavor }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "${INPUT_FLAVOR:-all}" in
            all) flavors='["mango","hyprland","niri"]' ;;
            *)   flavors="[\"${INPUT_FLAVOR}\"]" ;;
          esac
          publish=false
          if [[ "${EVENT}" != pull_request && "${REF}" == refs/heads/main ]]; then
            publish=true
          fi
          echo "flavors=${flavors}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "Flavors: ${flavors}  Publish: ${publish}"

  check:
    name: Check packages (${{ matrix.flavor }})
    needs: plan
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.plan.outputs.flavors) }}
    steps:
      - name: Tools
        run: dnf5 install -y --setopt=install_weak_deps=False git-core
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check every listed package exists
        run: scripts/check-packages.sh "${{ matrix.flavor }}"

  release:
    name: Prepare "testing" release
    needs: [plan, check]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Make sure the rolling pre-release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          Automatic test builds. Not a stable release.

          Each flavor's ISO is replaced only when that flavor builds and its install
          rehearsal passes, so the file name's commit can differ between flavors.
          After installing, \`cat /usr/share/perihelion/release\` shows the same commit.

          Each ISO is Fedora's Everything netinstall installer with the Perihelion
          kickstart. Boot it, pick a disk and create your user; packages download
          during installation, so the machine needs internet.

          Verify a download with: \`sha256sum -c perihelion-<flavor>-*.iso.sha256\`

          Built without wallpapers (the login screen uses a plain background).
          EOF
          )
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "Perihelion testing builds" --notes "${notes}"
          else
            gh release create "${RELEASE_TAG}" --prerelease --target "${SHA}" \
              --title "Perihelion testing builds" --notes "${notes}"
          fi

  build:
    name: Build ISO (${{ matrix.flavor }})
    needs: [plan, check, release]
    # Run when "release" succeeded or was skipped (pull requests), not when it failed.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.plan.outputs.flavors) }}
    steps:
      - name: Tools
        run: |
          dnf5 install -y --setopt=install_weak_deps=False \
            git-core xorriso rsync isomd5sum pykickstart curl gh gnupg2 fedora-gpg-keys xz
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache nwg-drawer
        id: drawer-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            system_files/common/usr/bin/nwg-drawer
            system_files/common/usr/share/nwg-drawer
            system_files/common/usr/share/licenses/nwg-drawer
          key: nwg-drawer-fc45-${{ hashFiles('scripts/build-nwg-drawer.sh') }}
      - name: Build nwg-drawer
        if: steps.drawer-cache.outputs.cache-hit != 'true'
        run: scripts/build-nwg-drawer.sh
      - name: Fetch Numix icon themes
        run: scripts/fetch-numix.sh
      - name: Cache Wine and winetricks
        id: wine-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            assets/wine
            system_files/common/usr/local/bin
          key: wine-${{ hashFiles('scripts/fetch-wine.sh') }}
      - name: Fetch Wine and winetricks
        if: steps.wine-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-wine.sh
      - name: Rehearse the install (packages + %post scripts)
        env:
          PERIHELION_COMMIT: ${{ github.sha }}
        run: scripts/test-install.sh "${{ matrix.flavor }}"
      - name: Build
        id: build
        env:
          PERIHELION_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d)
          name="perihelion-${{ matrix.flavor }}-${stamp}-${GITHUB_SHA:0:7}.iso"
          export PERIHELION_COMMIT="${PERIHELION_COMMIT:0:7}"
          # Fail rather than skip Fedora's signed CHECKSUM check.
          export PERIHELION_REQUIRE_SIGNED=1
          scripts/build-iso.sh --flavor "${{ matrix.flavor }}" --download --output "out/${name}"
          (cd out && sha256sum "${name}" > "${name}.sha256")
          ls -lh out/
          echo "iso=out/${name}" >> "$GITHUB_OUTPUT"
      - name: Verify the ISO
        env:
          ISO: ${{ steps.build.outputs.iso }}
        run: |
          set -euo pipefail
          checkisomd5 "${ISO}"
          # The kickstart and the repository payload are on the image, and
          # both boot menus point the installer at the kickstart.
          for path in /perihelion.ks /perihelion/BUILD /perihelion/build/common-post.sh /perihelion/packages/base.txt; do
            rm -f /tmp/check
            xorriso -osirrox on -indev "${ISO}" -extract "${path}" /tmp/check >/dev/null 2>&1
            test -s /tmp/check || { echo "missing on the ISO: ${path}" >&2; exit 1; }
          done
          for cfg in /EFI/BOOT/grub.cfg /boot/grub2/grub.cfg; do
            xorriso -osirrox on -indev "${ISO}" -extract "${cfg}" /tmp/grub.cfg >/dev/null 2>&1
            grep -q 'inst.ks=.*:/perihelion.ks' /tmp/grub.cfg
          done
          xorriso -osirrox on -indev "${ISO}" -extract /perihelion/BUILD /tmp/BUILD >/dev/null 2>&1
          grep -qx "PERIHELION_COMMIT=${GITHUB_SHA:0:7}" /tmp/BUILD || { echo "ISO is not stamped with this commit" >&2; cat /tmp/BUILD; exit 1; }
          cat /tmp/BUILD
          size=$(stat -c %s "${ISO}")
          (( size < 2147483648 )) || { echo "ISO is over GitHub's 2 GiB release file limit" >&2; exit 1; }
          echo "ISO OK: $(basename "${ISO}"), $((size / 1048576)) MiB"
      - name: Attach to the "testing" release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISO: ${{ steps.build.outputs.iso }}
        run: |
          set -euo pipefail
          # Replace only this flavor's files; the other flavors keep theirs.
          gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' \
            | { grep "^perihelion-${{ matrix.flavor }}-" || true; } \
            | while read -r asset; do gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes; done
          gh release upload "${RELEASE_TAG}" "${ISO}" "${ISO}.sha256" --clobber
