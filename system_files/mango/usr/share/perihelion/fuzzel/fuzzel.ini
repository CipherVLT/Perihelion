# Perihelion launcher (fuzzel): Catppuccin Macchiato.
# Your copy: ~/.config/fuzzel/fuzzel.ini   Reference: man fuzzel.ini
[main]
font=Noto Sans:size=12
terminal=kitty -e
prompt="❯ "
width=40
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=6

[colors]
background=24273add
text=cad3f5ff
prompt=8aadf4ff
input=cad3f5ff
match=8aadf4ff
selection=363a4fff
selection-text=cad3f5ff
selection-match=8aadf4ff
border=8aadf4ff

[border]
width=2
radius=8
