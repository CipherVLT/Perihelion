#? Perihelion: btop's colors follow the wallpaper. perihelion-theme writes
#? ~/.config/btop/themes/perihelion.theme on every wallpaper change; pick
#? another theme in btop's options (Esc > Options) to use your own.
color_theme = "perihelion"

#* See-through like kitty: the terminal's background shows behind btop.
theme_background = false

#* 24-bit colors (kitty supports them).
truecolor = true
