# The bar's cava (simpbar reads this; it only writes its own when missing).
# Perihelion: input through PulseAudio (PipeWire serves it via
# pipewire-pulseaudio) because Fedora's cava is built without PipeWire
# input, so simpbar's default "method = pipewire" makes cava exit at start.
[general]
bars = 24
bar_width = 1
bar_spacing = 1
sleep_timer = 0

[input]
method = pulse
source = auto

[output]
method = raw
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
