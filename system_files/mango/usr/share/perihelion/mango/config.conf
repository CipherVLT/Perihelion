# Perihelion Mango config: Veyl OS keybinds and look, translated to Mango.
#
# Your copy is ~/.config/mango/ (seeded once at install): this file pulls in
# the parts under cfg/, the same layout as simpbar's, which Perihelion
# Settings (Mango section) edits. Edit them there or by hand, then press
# Super+Shift+R to reload. The pristine version stays at
# /usr/share/perihelion/mango/.
#
# Check it for mistakes:   mango -p -c ~/.config/mango/config.conf
# See every keybind:       Super+H
# Full option reference:   https://mangowm.github.io/docs

source=./cfg/monitors.conf
source=./cfg/keybinds.conf
source=./cfg/input.conf
source=./cfg/autostart.conf
source=./cfg/env.conf
source=./cfg/appearance.conf
source=./cfg/layout.conf
source=./cfg/misc.conf
source=./cfg/rules.conf

# Glass mode (Super+G, perihelion-glass) writes this file; windows opened
# while it's on are see-through.
source_optional=~/.config/mango/glass.conf

# Window border colors follow the wallpaper: perihelion-theme writes this file
# (Catppuccin, matched to the wallpaper). Keep this line last so it wins.
source_optional=~/.config/mango/colors.conf
