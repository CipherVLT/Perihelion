# Perihelion Mango config: Veyl OS keybinds and look, translated to Mango.
#
# Your copy is ~/.config/mango/config.conf (seeded once at install). Edit it,
# then press Super+Shift+R to reload. The pristine version stays at
# /usr/share/perihelion/mango/config.conf.
#
# Check it for mistakes:   mango -p -c ~/.config/mango/config.conf
# See every keybind:       Super+H
# Full option reference:   https://mangowm.github.io/docs
#
# Lines starting with "#:" describe the bind below them; perihelion-keys
# (Super+H) reads them. Colors are 0xRRGGBBAA (Catppuccin Macchiato).

# ============================================================================
# Look
# ============================================================================

# Gaps: 2 px between windows, 4 px to the screen edges (as in Veyl OS)
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=4
gap_outer_vertical=4

# Borders: 2 px, Catppuccin Macchiato blue (#8aadf4) on the focused window
border_px=2
focus_color=0x8aadf4ff
border_color=0x494d64ff
urgent_color=0xed8796ff
maximized_screen_color=0x8aadf4ff
drop_color=0x8aadf455
split_color=0xc6a0f6ff
root_color=0x24273aff

# Animations, matched to Veyl OS's Hyprland: windows slide in, slide out
# while fading to nothing, and glide when moved (Hyprland's winIn, winOut
# and wind curves; Mango takes no negative values, so winOut loses its small
# pull-back). A plain fade on close: animation_type_close=fade
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.0
fade_out_begin_opacity=1.0
animation_duration_open=500
animation_duration_close=450
animation_duration_move=450
animation_duration_tag=400
animation_curve_open=0.1,1.1,0.1,1.1
animation_curve_close=0.3,0,0,1
animation_curve_move=0.05,0.9,0.1,1.05
animation_curve_tag=0.05,0.9,0.1,1.05
animation_curve_opacity_fade_in=0.25,0.1,0.25,1
animation_curve_opacity_fade_out=0.25,0.1,0.25,1

# Rounded corners, slightly see-through unfocused windows
border_radius=8
focused_opacity=1.0
unfocused_opacity=0.90

# Always-glass apps (see-through, wallpaper blurred behind). Add your own:
#   window_rule=focused_opacity:0.85,unfocused_opacity:0.80,app_id:^your\.app$
# (app ids: mmsg get clients, or wev). kitty draws its own glass, so the
# compositor leaves it and Steam games solid.
window_rule=focused_opacity:0.85,unfocused_opacity:0.80,app_id:^moe\.launcher\.the-honkers-railway-launcher$
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^kitty$
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^steam_app_
# Glass mode (Super+G, perihelion-glass) writes this file; windows opened
# while it's on are see-through.
source_optional=~/.config/mango/glass.conf

# Blur behind see-through windows (kitty is 80% opaque by default), so the
# wallpaper shows through softly. Turn off with blur=0 on slow hardware.
blur=1
blur_layer=0
blur_optimized=1
blur_params_radius=7
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# Shadows under floating windows only
shadows=1
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_color=0x00000088

# Qt apps take their look from qt6ct (~/.config/qt6ct/qt6ct.conf).
env=QT_QPA_PLATFORMTHEME,qt6ct
cursor_theme=Bibata-Modern-Classic
cursor_size=24

# ============================================================================
# Layout and behaviour
# ============================================================================

# Dwindle on every workspace, like Hyprland's default
tag_rule=id:*,layout_name:dwindle
dwindle_preserve_split=1

# Drag the gap/border between windows with the left mouse button, no key
# held (Hyprland's resize_on_border). The grab strip is 10 px wide.
enable_border_resize=1
border_resize_size=10

# Floating windows snap to edges and other windows
enable_floating_snap=1
snap_distance=30

# ============================================================================
# Input
# ============================================================================

xkb_rules_layout=us
numlock_on=1
repeat_delay=250
repeat_rate=35

# Mouse: flat acceleration (raw movement, as in Veyl OS)
mouse_accel_profile=1

# Touchpad
tap_to_click=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_click_method=2
trackpad_scroll_factor=0.5

# ============================================================================
# Autostart
# ============================================================================

# Let portals (Open/Save dialogs, screen sharing) see this session
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# Wallpaper (swaybg). Change it with: perihelion-wallpaper /path/to/image.png
exec_once=perihelion-wallpaper
# Top bar (simpbar by jaytheoutpatient; config: ~/.config/simpbar/config.json)
# (waits for the default audio output first, so the bar's cava hears it)
exec_once=perihelion-simpbar-start
# Desktop widgets and window overview (simpbar-shell; ~/.config/simpbar/shell.json)
exec_once=simpbar-shell
# Password prompts for apps that ask for admin rights (Steam, pkexec, ...)
exec_once=/usr/libexec/polkit-mate-authentication-agent-1

# ============================================================================
# Key bindings (Super = the Windows key)
# ============================================================================

# --- Applications -----------------------------------------------------------
#: Terminal (kitty)
bind=SUPER,Return,spawn,kitty
#: App launcher (fuzzel)
bind=SUPER,d,spawn,fuzzel
#: App drawer (all apps in a grid)
bind=SUPER,a,spawn,perihelion-drawer
#: Wallpaper picker
bind=SUPER+SHIFT,w,spawn,perihelion-wallpaper-picker
bind=SUPER,g,spawn,perihelion-glass
#: File manager (Strata)
bind=SUPER,e,spawn,strata
#: Browser (Firefox)
bind=SUPER,b,spawn,firefox
#: Steam
bind=SUPER,s,spawn,steam
#: Show all keybinds
bind=SUPER,h,spawn,perihelion-keys
#: Lock screen
bind=SUPER,l,spawn,swaylock -f -c 24273a
#: Power menu (lock, log out, suspend, reboot, power off)
bind=SUPER+SHIFT,q,spawn,perihelion-power-menu
#: Log out
bind=SUPER+SHIFT,e,quit
#: Log out
bind=SUPER,m,quit
#: Reload this config
bind=SUPER+SHIFT,r,reload_config
#: Restart the top bar
bind=SUPER+SHIFT,d,spawn_shell,pkill -x simpbar; sleep 0.3; simpbar
#: Overview of all windows
bind=SUPER,o,toggleoverview
#: Window overview with live previews and search (simpbar-shell)
bind=ALT,w,spawn,simpbar-shell overview toggle

# --- Windows ------------------------------------------------------------------
#: Close window
bind=SUPER,q,killclient
#: Toggle floating
bind=SUPER,w,togglefloating
#: Toggle fullscreen
bind=SUPER,f,togglefullscreen

#: Focus left
bind=SUPER,Left,focusdir,left
#: Focus right
bind=SUPER,Right,focusdir,right
#: Focus up
bind=SUPER,Up,focusdir,up
#: Focus down
bind=SUPER,Down,focusdir,down
#: Cycle windows
bind=ALT,Tab,focusstack,next

#: Resize window (grow right)
bind=SUPER+SHIFT,Right,resizewin,+30,0
#: Resize window (shrink left)
bind=SUPER+SHIFT,Left,resizewin,-30,0
#: Resize window (shrink up)
bind=SUPER+SHIFT,Up,resizewin,0,-30
#: Resize window (grow down)
bind=SUPER+SHIFT,Down,resizewin,0,+30

#: Swap window left
bind=SUPER+SHIFT+CTRL,Left,exchange_client,left
#: Swap window right
bind=SUPER+SHIFT+CTRL,Right,exchange_client,right
#: Swap window up
bind=SUPER+SHIFT+CTRL,Up,exchange_client,up
#: Swap window down
bind=SUPER+SHIFT+CTRL,Down,exchange_client,down

#: Resize mode (arrows resize, Esc leaves)
bind=SUPER,x,setkeymode,resize

# --- Screenshots (saved to ~/Pictures/Screenshots and copied) -------------------
#: Screenshot a region
bind=SUPER+SHIFT,s,spawn,perihelion-screenshot region
#: Screenshot a region
bind=SUPER,Print,spawn,perihelion-screenshot region
#: Screenshot all screens
bind=NONE,Print,spawn,perihelion-screenshot full
#: Screenshot all screens
bind=ALT,Print,spawn,perihelion-screenshot full

# --- Workspaces (Mango calls them tags; there are 9) ------------------------------
#: Workspace 1
bind=SUPER,1,view,1
#: Workspace 2
bind=SUPER,2,view,2
#: Workspace 3
bind=SUPER,3,view,3
#: Workspace 4
bind=SUPER,4,view,4
#: Workspace 5
bind=SUPER,5,view,5
#: Workspace 6
bind=SUPER,6,view,6
#: Workspace 7
bind=SUPER,7,view,7
#: Workspace 8
bind=SUPER,8,view,8
#: Workspace 9
bind=SUPER,9,view,9
#: Move window to workspace 1
bind=SUPER+SHIFT,1,tag,1
#: Move window to workspace 2
bind=SUPER+SHIFT,2,tag,2
#: Move window to workspace 3
bind=SUPER+SHIFT,3,tag,3
#: Move window to workspace 4
bind=SUPER+SHIFT,4,tag,4
#: Move window to workspace 5
bind=SUPER+SHIFT,5,tag,5
#: Move window to workspace 6
bind=SUPER+SHIFT,6,tag,6
#: Move window to workspace 7
bind=SUPER+SHIFT,7,tag,7
#: Move window to workspace 8
bind=SUPER+SHIFT,8,tag,8
#: Move window to workspace 9
bind=SUPER+SHIFT,9,tag,9

#: Next workspace
bind=SUPER+CTRL,Right,viewtoright
#: Previous workspace
bind=SUPER+CTRL,Left,viewtoleft
#: Open an empty workspace
bind=SUPER+CTRL,Down,view_insert,next
#: Next workspace (with windows)
bind=SUPER,Tab,viewtoright_have_client
#: Previous workspace (with windows)
bind=SUPER+SHIFT,Tab,viewtoleft_have_client
#: Move window to next workspace
bind=SUPER+CTRL+ALT,Right,tagtoright
#: Move window to previous workspace
bind=SUPER+CTRL+ALT,Left,tagtoleft

# --- Media keys (work on the lock screen too) -----------------------------------
#: Play / pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
#: Next track
bindl=NONE,XF86AudioNext,spawn,playerctl next
#: Previous track
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
#: Volume up
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
#: Volume down
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#: Mute
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
#: Brightness up
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
#: Brightness down
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# --- Mouse --------------------------------------------------------------------------
#: Super + left drag: move window
mousebind=SUPER,btn_left,moveresize,curmove
#: Super + right drag: resize window
mousebind=SUPER,btn_right,moveresize,curresize
#: Super + scroll down: next workspace with windows
axisbind=SUPER,DOWN,viewtoright_have_client
#: Super + scroll up: previous workspace with windows
axisbind=SUPER,UP,viewtoleft_have_client

# --- Touchpad gestures ------------------------------------------------------------------
#: Next workspace with windows
gesturebind=none,left,3,viewtoright_have_client
#: Previous workspace with windows
gesturebind=none,right,3,viewtoleft_have_client
#: Overview of all windows
gesturebind=none,up,3,toggleoverview
#: Overview of all windows
gesturebind=none,down,3,toggleoverview

# --- Resize mode (Super+X) -------------------------------------------------------------
key_mode=resize
#: Shrink left
bind=NONE,Left,resizewin,-30,0
#: Grow right
bind=NONE,Right,resizewin,+30,0
#: Shrink up
bind=NONE,Up,resizewin,0,-30
#: Grow down
bind=NONE,Down,resizewin,0,+30
#: Leave resize mode
bind=NONE,Escape,setkeymode,default
#: Leave resize mode
bind=NONE,Return,setkeymode,default
key_mode=default
