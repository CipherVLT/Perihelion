# Perihelion Mango config: Look: gaps, borders, opacity, blur, shadows and animations. Colors are
# 0xRRGGBBAA; the border colors are overridden by ../colors.conf, which
# perihelion-theme writes from the wallpaper.

# Gaps: 2 px between windows, 4 px to the screen edges (as in Veyl OS)
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=4
gap_outer_vertical=4

# Borders: 2 px, Catppuccin Macchiato blue (#8aadf4) on the focused window
border_px=2
focus_color=0x8aadf4ff
border_color=0x494d64ff
urgent_color=0xed8796ff
maximized_screen_color=0x8aadf4ff
drop_color=0x8aadf455
split_color=0xc6a0f6ff
root_color=0x24273aff

# Animations, matched to Veyl OS's Hyprland: windows slide in, slide out
# while fading to nothing, and glide when moved (Hyprland's winIn, winOut
# and wind curves; Mango takes no negative values, so winOut loses its small
# pull-back). A plain fade on close: animation_type_close=fade
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.0
fade_out_begin_opacity=1.0
animation_duration_open=500
animation_duration_close=450
animation_duration_move=450
animation_duration_tag=400
animation_curve_open=0.1,1.1,0.1,1.1
animation_curve_close=0.3,0,0,1
animation_curve_move=0.05,0.9,0.1,1.05
animation_curve_tag=0.05,0.9,0.1,1.05
animation_curve_opacity_fade_in=0.25,0.1,0.25,1
animation_curve_opacity_fade_out=0.25,0.1,0.25,1

# Rounded corners, slightly see-through unfocused windows
border_radius=8
focused_opacity=1.0
unfocused_opacity=0.90

# Blur behind see-through windows (kitty is 80% opaque by default), so the
# wallpaper shows through softly. Turn off with blur=0 on slow hardware.
blur=1
blur_layer=0
blur_optimized=1
blur_params_radius=7
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# Shadows under floating windows only
shadows=1
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_color=0x00000088
cursor_theme=Bibata-Modern-Classic
cursor_size=24
