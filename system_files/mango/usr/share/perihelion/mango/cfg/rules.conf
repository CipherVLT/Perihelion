# Perihelion Mango config: Window, layer and tag rules.

# Always-glass apps (see-through, wallpaper blurred behind). Add your own:
#   window_rule=focused_opacity:0.85,unfocused_opacity:0.80,app_id:^your\.app$
# (app ids: mmsg get clients, or wev). kitty draws its own glass, so the
# compositor leaves it and Steam games solid.
window_rule=focused_opacity:0.85,unfocused_opacity:0.80,app_id:^moe\.launcher\.the-honkers-railway-launcher$
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^kitty$
# Floating terminal (Super+Shift+Return): 50% x 55% in the bottom-right
# corner (offset 100 = flush with the edge). Drag with Super+left mouse.
window_rule=is_floating:1,width:0.5,height:0.55,offset_x:100,offset_y:100,app_id:^perihelion-float$
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^perihelion-float$
# Wallpaper picker (Super+Shift+W): floating, centered
window_rule=is_floating:1,width:0.75,height:0.72,app_id:^io\.github\.perihelion\.Wallpapers$
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^steam_app_


# Dwindle on every workspace, like Hyprland's default
tag_rule=id:*,layout_name:dwindle

# Fullscreen see-through overlays opt out of layer blur: the app drawer's
# dimmed backdrop (its own glass panel needs none) and slurp's selection.
layer_rule=no_blur:1,layer_name:appdrawer
layer_rule=no_blur:1,layer_name:selection
