# Perihelion Mango config: Keybinds. Lines starting with "#:" describe the bind below them;
# perihelion-keys (Super+H) reads them.

# --- Applications -----------------------------------------------------------
#: Terminal (kitty)
bind=SUPER,Return,spawn,kitty
# Floating terminal for showcases: half the screen, bottom-right corner
bind=SUPER+SHIFT,Return,spawn,kitty --class perihelion-float
#: App launcher (fuzzel)
bind=SUPER,d,spawn,fuzzel
#: App drawer (all apps in a grid)
bind=SUPER,a,spawn,perihelion-drawer
#: Wallpaper picker
bind=SUPER+SHIFT,w,spawn,perihelion-wallpaper-picker
bind=SUPER,g,spawn,perihelion-glass
# Blur strength, live: normal -> strong -> soft -> off
bind=SUPER+SHIFT,g,spawn,perihelion-blur
#: File manager (Strata)
bind=SUPER,e,spawn,strata
#: Browser (Firefox)
bind=SUPER,b,spawn,firefox
#: Steam
bind=SUPER,s,spawn,steam
#: Show all keybinds
bind=SUPER,h,spawn,perihelion-keys
#: Lock screen
bind=SUPER,l,spawn,perihelion-lock
#: Power menu (lock, log out, suspend, reboot, power off)
bind=SUPER+SHIFT,q,spawn,perihelion-power-menu
#: Log out
bind=SUPER+SHIFT,e,quit
#: Log out
bind=SUPER,m,quit
#: Reload this config
bind=SUPER+SHIFT,r,reload_config
#: Restart the top bar
bind=SUPER+SHIFT,d,spawn,perihelion-bar-start
#: Overview of all windows
bind=SUPER,o,toggleoverview
#: Window overview with live previews and search (Perihelion Shell)
bind=ALT,w,spawn,perihelion-shell overview toggle

# --- Windows ------------------------------------------------------------------
#: Close window
bind=SUPER,q,killclient
#: Toggle floating
bind=SUPER,w,togglefloating
#: Toggle fullscreen
bind=SUPER,f,togglefullscreen

#: Focus left
bind=SUPER,Left,focusdir,left
#: Focus right
bind=SUPER,Right,focusdir,right
#: Focus up
bind=SUPER,Up,focusdir,up
#: Focus down
bind=SUPER,Down,focusdir,down
#: Cycle windows
bind=ALT,Tab,focusstack,next

#: Resize window (grow right)
bind=SUPER+SHIFT,Right,resizewin,+30,0
#: Resize window (shrink left)
bind=SUPER+SHIFT,Left,resizewin,-30,0
#: Resize window (shrink up)
bind=SUPER+SHIFT,Up,resizewin,0,-30
#: Resize window (grow down)
bind=SUPER+SHIFT,Down,resizewin,0,+30

#: Swap window left
bind=SUPER+SHIFT+CTRL,Left,exchange_client,left
#: Swap window right
bind=SUPER+SHIFT+CTRL,Right,exchange_client,right
#: Swap window up
bind=SUPER+SHIFT+CTRL,Up,exchange_client,up
#: Swap window down
bind=SUPER+SHIFT+CTRL,Down,exchange_client,down

#: Resize mode (arrows resize, Esc leaves)
bind=SUPER,x,setkeymode,resize

# --- Screenshots (saved to ~/Pictures/Screenshots and copied) -------------------
#: Screenshot a region
bind=SUPER+SHIFT,s,spawn,perihelion-screenshot region
#: Screenshot a region
bind=SUPER,Print,spawn,perihelion-screenshot region
#: Screenshot all screens
bind=NONE,Print,spawn,perihelion-screenshot full
#: Screenshot all screens
bind=ALT,Print,spawn,perihelion-screenshot full

# --- Workspaces (Mango calls them tags; there are 9) ------------------------------
#: Workspace 1
bind=SUPER,1,view,1
#: Workspace 2
bind=SUPER,2,view,2
#: Workspace 3
bind=SUPER,3,view,3
#: Workspace 4
bind=SUPER,4,view,4
#: Workspace 5
bind=SUPER,5,view,5
#: Workspace 6
bind=SUPER,6,view,6
#: Workspace 7
bind=SUPER,7,view,7
#: Workspace 8
bind=SUPER,8,view,8
#: Workspace 9
bind=SUPER,9,view,9
#: Move window to workspace 1
bind=SUPER+SHIFT,1,tag,1
#: Move window to workspace 2
bind=SUPER+SHIFT,2,tag,2
#: Move window to workspace 3
bind=SUPER+SHIFT,3,tag,3
#: Move window to workspace 4
bind=SUPER+SHIFT,4,tag,4
#: Move window to workspace 5
bind=SUPER+SHIFT,5,tag,5
#: Move window to workspace 6
bind=SUPER+SHIFT,6,tag,6
#: Move window to workspace 7
bind=SUPER+SHIFT,7,tag,7
#: Move window to workspace 8
bind=SUPER+SHIFT,8,tag,8
#: Move window to workspace 9
bind=SUPER+SHIFT,9,tag,9

#: Next workspace
bind=SUPER+CTRL,Right,viewtoright
#: Previous workspace
bind=SUPER+CTRL,Left,viewtoleft
#: Open an empty workspace
bind=SUPER+CTRL,Down,view_insert,next
#: Next workspace (with windows)
bind=SUPER,Tab,viewtoright_have_client
#: Previous workspace (with windows)
bind=SUPER+SHIFT,Tab,viewtoleft_have_client
#: Move window to next workspace
bind=SUPER+CTRL+ALT,Right,tagtoright
#: Move window to previous workspace
bind=SUPER+CTRL+ALT,Left,tagtoleft

# --- Media keys (work on the lock screen too) -----------------------------------
#: Play / pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
#: Next track
bindl=NONE,XF86AudioNext,spawn,playerctl next
#: Previous track
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
#: Volume up
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
#: Volume down
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#: Mute
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
#: Brightness up
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
#: Brightness down
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# --- Mouse --------------------------------------------------------------------------
#: Super + left drag: move window
mousebind=SUPER,btn_left,moveresize,curmove
#: Super + right drag: resize window
mousebind=SUPER,btn_right,moveresize,curresize
#: Super + scroll down: next workspace with windows
axisbind=SUPER,DOWN,viewtoright_have_client
#: Super + scroll up: previous workspace with windows
axisbind=SUPER,UP,viewtoleft_have_client

# --- Touchpad gestures ------------------------------------------------------------------
#: Next workspace with windows
gesturebind=none,left,3,viewtoright_have_client
#: Previous workspace with windows
gesturebind=none,right,3,viewtoleft_have_client
#: Overview of all windows
gesturebind=none,up,3,toggleoverview
#: Overview of all windows
gesturebind=none,down,3,toggleoverview

# --- Resize mode (Super+X) -------------------------------------------------------------
key_mode=resize
#: Shrink left
bind=NONE,Left,resizewin,-30,0
#: Grow right
bind=NONE,Right,resizewin,+30,0
#: Shrink up
bind=NONE,Up,resizewin,0,-30
#: Grow down
bind=NONE,Down,resizewin,0,+30
#: Leave resize mode
bind=NONE,Escape,setkeymode,default
#: Leave resize mode
bind=NONE,Return,setkeymode,default
key_mode=default
