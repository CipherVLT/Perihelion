# Perihelion Mango config: Programs started with the session (exec_once) and on every reload (exec).

# Let portals (Open/Save dialogs, screen sharing) see this session
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# Wallpaper (swaybg). Change it with: perihelion-wallpaper /path/to/image.png
exec_once=perihelion-wallpaper
# Perihelion Bar on top and its dock at the bottom (our fork of simpbar by
# jaytheoutpatient; config: ~/.config/simpbar/config.json)
# (waits for the default audio output first, so the bar's cava hears it)
exec_once=perihelion-bar-start
# Desktop widgets and window overview (Perihelion Shell; ~/.config/simpbar/shell.json)
exec_once=perihelion-shell
# Password prompts for apps that ask for admin rights (Steam, pkexec, ...)
exec_once=/usr/libexec/polkit-mate-authentication-agent-1
# Lock after 10 idle minutes, and before suspend (perihelion-lock)
exec_once=swayidle -w timeout 600 perihelion-lock before-sleep perihelion-lock
