# Perihelion Mango config: Keyboard, mouse and touchpad.

xkb_rules_layout=us
numlock_on=1
repeat_delay=250
repeat_rate=35

# Mouse: flat acceleration (raw movement, as in Veyl OS)
mouse_accel_profile=1

# Touchpad
tap_to_click=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_click_method=2
trackpad_scroll_factor=0.5
