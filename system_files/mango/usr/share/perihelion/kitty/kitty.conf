# Perihelion (Mango): kitty reads only this file, so it pulls in Perihelion's
# system settings first, then the colors perihelion-theme writes for every
# wallpaper (background, text and the 16 terminal colors). Open terminals
# reload them by themselves. Put your own settings below; to keep fixed
# colors, delete the globinclude line.
include /etc/xdg/kitty/kitty.conf
globinclude perihelion-colors.conf
