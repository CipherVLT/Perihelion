# Perihelion default for kitty. Your own ~/.config/kitty/kitty.conf, if
# you create one, is used instead of this file.

# See-through glass: the compositor blurs whatever is behind the window, so the
# wallpaper shows through softly while text stays readable. 1.0 = solid.
background_opacity 0.8
# Ctrl+Shift+A then M / L makes the current window more / less see-through.
dynamic_background_opacity yes

# --- Catppuccin Macchiato ------------------------------------------------------
# https://catppuccin.com/palette/ (theme: github.com/catppuccin/kitty, MIT).
# Cursor and selection use Perihelion's accent blue #8aadf4 instead of
# Catppuccin's rosewater, to match the window borders and fastfetch.
foreground              #CAD3F5
background              #24273A
selection_foreground    #24273A
selection_background    #8AADF4
cursor                  #8AADF4
cursor_text_color       #24273A
url_color               #8AADF4

active_border_color     #8AADF4
inactive_border_color   #6E738D
bell_border_color       #EED49F

active_tab_foreground   #181926
active_tab_background   #8AADF4
inactive_tab_foreground #CAD3F5
inactive_tab_background #1E2030
tab_bar_background      #181926

mark1_foreground #24273A
mark1_background #B7BDF8
mark2_foreground #24273A
mark2_background #C6A0F6
mark3_foreground #24273A
mark3_background #7DC4E4

