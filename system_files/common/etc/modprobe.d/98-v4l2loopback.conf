# OBSBOT relay: one loopback at /dev/video10 named "OBSBOT Clean".
# Same name as Terra's /usr/lib/modprobe.d/98-v4l2loopback.conf, which this
# replaces (it only set exclusive_caps=1 card_label="OBS Virtual Camera").
# exclusive_caps=1: the device shows up as a camera only while the relay
# writes to it (what OBS and browsers look for).
options v4l2loopback video_nr=10 card_label="OBSBOT Clean" exclusive_caps=1
