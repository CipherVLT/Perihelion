[General]
# Perihelion: the default wallpaper, copied here by build/common-post.sh
# (build_files/install-greeter.sh).
background=assets/background.png

# Colors: Catppuccin Macchiato until a desktop wallpaper is chosen; then
# theme.conf.user (perihelion-greeter-sync) carries the desktop's own.
# autoColor picks the accent from the wallpaper (Material You).
accentColor=#8AADF4
autoColor=true
use24HourClock=false
backgroundColor=#24273A
textColor=#CAD3F5

# Font family. Empty uses the theme's own font.
fontFamily=
